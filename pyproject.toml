[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-triage-mlops"
version = "0.1.0"
description = "Triagem automática de laudos médicos (NLP) servida via FastAPI, com CI/CD (GitHub Actions), retreino orquestrado (Airflow), monitoramento (Prometheus + Grafana) e otimização de latência (ONNX). FIAP MLE Tech Challenge — Fase 3."
readme = "README.md"
authors = [
  {name = "Gustavo Dell Anhol Oliveira", email = "gustavo.dellanhol@gmail.com"}
]
maintainers = [
  {name = "Gustavo Dell Anhol Oliveira", email = "gustavo.dellanhol@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = { file = "LICENSE" }
dependencies = [
    "apache-airflow>=3.3.1",
    "fastapi>=0.136.1",
    "joblib>=1.5.3",
    "numpy>=2.5.0",
    "onnxruntime>=1.20.0",
    "pandas<3",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "rich",
    "scikit-learn>=1.9.0",
    "skl2onnx>=1.18.0",
    "typer",
    "uvicorn>=0.47.0",
]
requires-python = ">=3.12,<3.15"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.11.0",
    "nbconvert>=7.16.0",
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/gudaoliveira/medical-triage-mlops/issues"
changelog = "https://github.com/gudaoliveira/medical-triage-mlops/releases"
documentation = "https://gudaoliveira.github.io/medical-triage-mlops/"
homepage = "https://github.com/gudaoliveira/medical-triage-mlops"

[project.scripts]
medical_triage_mlops = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

#################################################################################
# RUFF                                                                          #
#################################################################################

[tool.ruff]
line-length = 99
target-version = "py313"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "docs/",
    "notebooks/",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort (import sorting)
    "N",  # pep8-naming
    "T20",  # flake8-print (proíbe print(), usar logging)
    "W",  # pycodestyle warnings
]
extend-ignore = [
    "E203",  # whitespace antes de ':' (conflita com ruff format)
    "E501",  # line too long (delegado ao ruff format)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

#################################################################################
# PYTEST                                                                        #
#################################################################################

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
minversion = "7.0"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: testes unitários (padrão)",
    "integration: testes de integração entre componentes",
    "model: testes de modelo/treino de ML",
    "api: testes de endpoint FastAPI",
    "slow: testes mais lentos (execute com -m 'not slow')",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "**/__init__.py", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 70
show_missing = true

#################################################################################
# UV                                                                            #
#################################################################################

[tool.ty.src]
exclude = ["notebooks/"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
