services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: inference-api-triage-mlops

    env_file:
      - path: .env
        required: false

    ports:
      - "8000:8000"

    # Alinha permissões dos bind mounts com o usuário do host em dev.
    user: "${UID:-1000}:${GID:-1000}"

    # Bind mounts para desenvolvimento com hot-reload; caminhos alinhados
    # com o WORKDIR /app definido no Dockerfile.
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs

    command: uvicorn src.api.api:api --host 0.0.0.0 --port 8000 --reload

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - triage-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus-triage-mlops
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - triage-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana-triage-mlops
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - triage-net

networks:
  triage-net:
    driver: bridge

volumes:
  grafana-data:
